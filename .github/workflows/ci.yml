name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[formats,dev]"

      - name: Run unit and integration tests
        env:
          RAG_ENV: test
          OTEL_SDK_DISABLED: "true"
        run: pytest -q

      - name: Run sample retrieval regression gate
        env:
          RAG_ENV: test
          RAG_MODE: local
          OTEL_SDK_DISABLED: "true"
        run: |
          recall benchmark --dataset sample --collection ci_benchmark --in-memory \
            --min-hit-rate 0.90 --min-mrr 0.60
