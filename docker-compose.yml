services:
  recall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recall-service
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - RAG_MODE=${RAG_MODE:-local}
      - RAG_ENV=${RAG_ENV:-production}
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - recall-net
    volumes:
      - recall-data:/app/data

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: recall-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - recall-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local Ollama inference container (run with: docker compose --profile local up)
  ollama:
    image: ollama/ollama:latest
    container_name: recall-ollama
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - recall-net

networks:
  recall-net:
    driver: bridge

volumes:
  recall-data:
  qdrant-storage:
  ollama-models:
