[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-kit"
version = "0.1.0"
description = "The Open-Source, Turnkey Enterprise RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Recall Team" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "enterprise-rag",
    "hybrid-search",
    "self-hosted",
    "turnkey",
    "qdrant",
    "litellm",
    "fastembed",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "xxhash>=3.4.1",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
]
docx = [
    "python-docx>=1.1.0",
]
formats = [
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
